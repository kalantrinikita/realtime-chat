# ${VAR:default} means: use the environment variable VAR if it's set, otherwise the default.
# The defaults work for running from IntelliJ with the database in Docker.

server:
  port: ${PORT:8080}
  # Use the X-Forwarded-* headers from the proxy (Caddy) in production.
  forward-headers-strategy: native
  # Let running requests finish when the app stops.
  shutdown: graceful

spring:
  application:
    name: realtime-chat
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/chat}
    username: ${DATABASE_USER:chat}
    password: ${DATABASE_PASSWORD:chat-local-only}
    hikari:
      # Maximum number of database connections.
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  threads:
    virtual:
      # Request threads block on JDBC; virtual threads make that cheap.
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 15s
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

chat:
  cookie-secure: ${COOKIE_SECURE:false}
  session-ttl: ${SESSION_TTL:30d}
  invite-code: ${INVITE_CODE:}
  # Extra origins allowed to open the WebSocket.
  allowed-origins: ${ALLOWED_ORIGINS:}

logging:
  level:
    com.chatapp: INFO
